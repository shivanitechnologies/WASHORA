<!DOCTYPE html>
<html lang="en" class="" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | CAR SHINE – Doorstep Car Detailing</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23D6FF36'><polygon points='12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2'/></svg>">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#101820',
            secondary: '#D6FF36',
            surface: '#252E35',
            lightbg: '#F5F6F3'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Manrope', 'sans-serif']
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/animations.css">
</head>
<body class="bg-[#F5F6F3] text-[#101820] dark:bg-[#101820] dark:text-[#F5F6F3] min-h-screen flex items-center justify-center p-4 relative transition-colors duration-300">

  <!-- Controls at Top Right (Theme & RTL equal dimensions 40x40px) -->
  <div class="fixed top-6 right-6 rtl:right-auto rtl:left-6 flex items-center gap-3 z-50">
    <button onclick="toggleTheme()" aria-label="Toggle Theme" class="w-10 h-10 rounded-xl border border-gray-200 dark:border-[#252E35] bg-white dark:bg-[#1A232C] text-gray-700 dark:text-gray-300 hover:text-[#D6FF36] flex items-center justify-center transition-colors shadow-sm">
      <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
      <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
    </button>
    <button onclick="toggleRTL()" aria-label="Toggle RTL Direction" class="w-10 h-10 rounded-xl border border-gray-200 dark:border-[#252E35] bg-white dark:bg-[#1A232C] text-gray-700 dark:text-gray-300 hover:text-[#D6FF36] flex items-center justify-center transition-colors shadow-sm font-bold text-xs">
      <i data-lucide="languages" class="w-4 h-4"></i>
    </button>
  </div>

  <!-- Background decorative light glow -->
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[300px] bg-[#D6FF36]/10 blur-[120px] pointer-events-none rounded-full"></div>

  <!-- Main Login Card (No navbar, no footer) -->
  <div class="w-full max-w-md bg-white dark:bg-[#1A232C] border border-gray-200 dark:border-[#252E35] rounded-3xl p-8 sm:p-10 shadow-2xl relative z-10">
    
    <!-- Logo Inside the Login Card -->
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center gap-2 mb-3 group">
        <div class="w-12 h-12 flex items-center justify-center group-hover:scale-105 transition-transform">
          <img src="assets/images/logo-icon.png" alt="CAR SHINE Logo Icon" class="w-full h-full object-contain drop-shadow-md">
        </div>
        <span class="text-2xl font-black tracking-wider uppercase font-heading text-gray-900 dark:text-white flex items-center gap-1.5">
          CAR <span class="text-[#D6FF36] font-black text-2xl drop-shadow-[0_1px_4px_rgba(0,0,0,0.4)]">SHINE</span>
        </span>
      </a>
      <h1 class="text-2xl font-black font-heading">Welcome Back</h1>
      <p class="text-xs text-gray-500 mt-1">Sign in to manage bookings, track vans & subscriptions</p>
    </div>

    <!-- Quick Demo Credentials Pill -->
    <div class="p-3 mb-6 rounded-xl bg-gray-50 dark:bg-[#101820] border border-gray-200 dark:border-[#252E35] text-xs flex items-center justify-between">
      <div>
        <span class="text-gray-400 block text-[10px] uppercase font-bold">Demo Customer Credentials:</span>
        <span class="font-bold text-[#101820] dark:text-[#D6FF36]">pravin@carshine.com</span>
      </div>
      <button type="button" onclick="fillDemoCredentials()" class="text-[11px] font-bold text-[#D6FF36] bg-[#101820] px-2.5 py-1 rounded-lg hover:brightness-125">
        Auto-Fill
      </button>
    </div>

    <!-- Login Form (Vertical input layout matching CTA width) -->
    <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
      
      <!-- Email or Mobile -->
      <div>
        <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wider mb-1.5">Email or Mobile Number</label>
        <div class="relative">
          <input type="text" id="login-email" required placeholder="name@example.com or mobile" 
                 class="w-full h-12 pl-10 pr-4 rounded-xl bg-[#F5F6F3] dark:bg-[#101820] border border-gray-300 dark:border-[#252E35] text-sm focus:outline-none focus:border-[#D6FF36] transition-colors">
          <i data-lucide="mail" class="w-4 h-4 text-gray-400 absolute left-3.5 top-4"></i>
        </div>
      </div>

      <!-- Password with Eye Toggle -->
      <div>
        <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wider mb-1.5">Password</label>
        <div class="relative">
          <input type="password" id="login-password" required placeholder="••••••••" 
                 class="w-full h-12 pl-10 pr-11 rounded-xl bg-[#F5F6F3] dark:bg-[#101820] border border-gray-300 dark:border-[#252E35] text-sm focus:outline-none focus:border-[#D6FF36] transition-colors">
          <i data-lucide="lock" class="w-4 h-4 text-gray-400 absolute left-3.5 top-4"></i>
          <button type="button" onclick="togglePasswordVisibility('login-password', 'eye-icon')" class="absolute right-3.5 top-3.5 text-gray-400 hover:text-white">
            <i id="eye-icon" data-lucide="eye" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <!-- Remember Me & Forgot Password on the SAME line -->
      <div class="flex items-center justify-between text-xs pt-1">
        <label class="flex items-center gap-2 cursor-pointer select-none">
          <input type="checkbox" id="remember-me" checked class="w-4 h-4 rounded text-[#D6FF36] focus:ring-0 accent-[#D6FF36] bg-gray-100 border-gray-300">
          <span class="text-gray-600 dark:text-gray-400 font-medium">Remember Me</span>
        </label>
        <a href="forgot-password.html" class="font-bold text-xs text-[#D6FF36] hover:underline">
          Forgot Password?
        </a>
      </div>

      <!-- Login CTA (Width matching inputs) -->
      <button type="submit" class="btn-primary w-full !h-12 text-sm font-bold shadow-lg mt-2">
        <i data-lucide="log-in" class="w-4 h-4"></i>
        <span>Sign In</span>
      </button>

      <!-- Google Sign In Button -->
      <button type="button" onclick="handleSocialLogin('Google')" class="w-full h-12 rounded-xl border border-gray-300 dark:border-[#252E35] bg-transparent text-gray-800 dark:text-white hover:bg-gray-100 dark:hover:bg-[#252E35] font-semibold text-xs flex items-center justify-center gap-2.5 transition-colors">
        <svg class="w-4 h-4" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Sign in with Google</span>
      </button>

    </form>

    <!-- Sign Up Redirect -->
    <div class="text-center pt-6 mt-6 border-t border-gray-100 dark:border-[#252E35] text-xs text-gray-500">
      Don’t have an account? 
      <a href="register.html" class="font-bold text-[#101820] dark:text-[#D6FF36] hover:underline ml-1">
        Sign Up Free
      </a>
    </div>

    <!-- Quick Back to Home -->
    <div class="text-center mt-3">
      <a href="index.html" class="text-[11px] text-gray-400 hover:text-white flex items-center justify-center gap-1">
        <i data-lucide="arrow-left" class="w-3 h-3 rtl:rotate-180"></i> Back to Homepage
      </a>
    </div>

  </div>

  <script src="assets/js/storage.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    function togglePasswordVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        input.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      if (window.lucide) window.lucide.createIcons();
    }

    function fillDemoCredentials() {
      document.getElementById('login-email').value = 'pravin@carshine.com';
      document.getElementById('login-password').value = 'carshine2026';
      showToast('Demo customer credentials filled!', 'info');
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      
      // Check admin shortcut
      if (email.toLowerCase().includes('admin')) {
        showToast('Logging into Admin Panel...', 'success');
        setTimeout(() => window.location.href = 'admin/dashboard.html', 800);
        return;
      }
      if (email.toLowerCase().includes('tech')) {
        showToast('Logging into Technician Portal...', 'success');
        setTimeout(() => window.location.href = 'technician/dashboard.html', 800);
        return;
      }

      showToast('Welcome back, Pravin! Redirecting to Dashboard...', 'success');
      setTimeout(() => window.location.href = 'customer/dashboard.html', 800);
    }

    function handleSocialLogin(provider) {
      showToast(`Signing in via ${provider}...`, 'info');
      setTimeout(() => window.location.href = 'customer/dashboard.html', 1000);
    }
  </script>
</body>
</html>
