<!DOCTYPE html>
<html lang="en" class="" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | CAR SHINE – Doorstep Car Detailing</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23D6FF36'><polygon points='12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2'/></svg>">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#101820',
            secondary: '#D6FF36',
            surface: '#252E35',
            lightbg: '#F5F6F3'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            brand: ['Montserrat', 'Outfit', 'sans-serif'],
            heading: ['Manrope', 'sans-serif']
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/mobile-responsive.css">
  <link rel="stylesheet" href="assets/css/mobile-drawer.css">
  <link rel="stylesheet" href="assets/css/auth-cars.css">
</head>
<body class="bg-[#F5F6F3] text-[#101820] dark:bg-[#070B0F] dark:text-[#F5F6F3] min-h-screen relative overflow-x-hidden transition-colors duration-300 auth-stage-container">

  <!-- ==================== BACKGROUND: Before & After Car Wash Studio ==================== -->
  <div class="auth-bg-layer" aria-hidden="true">
    <img src="assets/images/auth-bg-cars.jpg" 
         alt="Before & After Car Detailing Comparison Fleet" 
         class="w-full h-full object-cover object-center">
    <!-- Ambient Contrast Gradients -->
    <div class="auth-bg-overlay-dark"></div>
    <div class="auth-bg-vignette"></div>
  </div>

  <!-- Top Controls: Theme & RTL -->
  <div class="fixed top-5 right-5 rtl:right-auto rtl:left-5 flex items-center gap-2.5 z-50">
    <button onclick="toggleTheme()" aria-label="Toggle Theme" class="w-10 h-10 rounded-xl border border-gray-200/80 dark:border-[#252E35] bg-white/90 dark:bg-[#1A232C]/90 backdrop-blur-md text-gray-700 dark:text-gray-300 hover:text-[#D6FF36] flex items-center justify-center transition-colors shadow-sm">
      <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
      <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
    </button>
    <button onclick="toggleRTL()" aria-label="Toggle RTL Direction" class="w-10 h-10 rounded-xl border border-gray-200/80 dark:border-[#252E35] bg-white/90 dark:bg-[#1A232C]/90 backdrop-blur-md text-gray-700 dark:text-gray-300 hover:text-[#D6FF36] flex items-center justify-center transition-colors shadow-sm font-bold text-xs">
      <i data-lucide="languages" class="w-4 h-4"></i>
    </button>
  </div>

  <!-- Ambient Floor Glow Behind Card -->
  <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[540px] h-[380px] bg-[#D6FF36]/15 blur-[140px] pointer-events-none rounded-full z-10"></div>

  <!-- ==================== CENTERED INPUT CARD ==================== -->
  <div class="w-full max-w-[460px] px-4 py-8 relative z-20 auth-center-card">
    <div class="auth-glass-box rounded-3xl p-7 sm:p-9 transition-all">
      
      <!-- Brand Logo Header -->
      <div class="text-center mb-6">
        <a href="index.html" class="inline-flex items-center gap-3 px-4 py-2 rounded-2xl bg-white/90 dark:bg-[#1A232C]/95 shadow-sm hover:scale-[1.02] transition-transform mb-3 border border-gray-200/60 dark:border-white/10">
          <div class="w-10 h-10 flex items-center justify-center flex-shrink-0">
            <img src="assets/images/logo-icon.png" alt="CAR SHINE Logo Icon" class="w-full h-full object-contain">
          </div>
          <div class="text-left">
            <div class="text-2xl font-black tracking-tight uppercase brand-title flex items-center gap-1 leading-none">
              <span class="text-[#101820] dark:text-white">CAR</span>
              <span class="text-[#84cc16] dark:text-[#D6FF36]">SHINE</span>
            </div>
            <span class="block text-[9px] tracking-widest text-gray-500 dark:text-gray-400 uppercase font-bold mt-1">Doorstep Detailing</span>
          </div>
        </a>
        <h1 class="text-2xl font-black font-heading tracking-tight text-[#101820] dark:text-white">Create an Account</h1>
        <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Book certified doorstep car detailing anywhere in Chennai</p>
      </div>

      <!-- Sign Up Form -->
      <form id="signup-form" onsubmit="handleSignUp(event)" class="space-y-3.5">
        
        <div>
          <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wider mb-1">Full Name *</label>
          <div class="relative">
            <input type="text" id="reg-name" required placeholder="e.g. Pravin Kumar" 
                   class="w-full h-11 pl-10 pr-4 rounded-xl bg-white dark:bg-[#0C1218] border border-gray-300 dark:border-[#252E35] text-sm text-gray-900 dark:text-white focus:outline-none focus:border-[#D6FF36] transition-colors shadow-inner">
            <i data-lucide="user" class="w-4 h-4 text-gray-400 absolute left-3.5 top-3.5"></i>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
          <div>
            <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wider mb-1">Email *</label>
            <div class="relative">
              <input type="email" id="reg-email" required placeholder="name@domain.com" 
                     class="w-full h-11 pl-10 pr-4 rounded-xl bg-white dark:bg-[#0C1218] border border-gray-300 dark:border-[#252E35] text-sm text-gray-900 dark:text-white focus:outline-none focus:border-[#D6FF36] transition-colors shadow-inner">
              <i data-lucide="mail" class="w-4 h-4 text-gray-400 absolute left-3.5 top-3.5"></i>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wider mb-1">Mobile *</label>
            <div class="relative">
              <input type="tel" id="reg-phone" required placeholder="+91 98400 00000" 
                     class="w-full h-11 pl-10 pr-4 rounded-xl bg-white dark:bg-[#0C1218] border border-gray-300 dark:border-[#252E35] text-sm text-gray-900 dark:text-white focus:outline-none focus:border-[#D6FF36] transition-colors shadow-inner">
              <i data-lucide="phone" class="w-4 h-4 text-gray-400 absolute left-3.5 top-3.5"></i>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wider mb-1">Password *</label>
          <div class="relative">
            <input type="password" id="reg-password" required placeholder="At least 6 characters" minlength="6"
                   class="w-full h-11 pl-10 pr-11 rounded-xl bg-white dark:bg-[#0C1218] border border-gray-300 dark:border-[#252E35] text-sm text-gray-900 dark:text-white focus:outline-none focus:border-[#D6FF36] transition-colors shadow-inner">
            <i data-lucide="lock" class="w-4 h-4 text-gray-400 absolute left-3.5 top-3.5"></i>
            <button type="button" onclick="togglePasswordVisibility('reg-password', 'reg-eye')" class="absolute right-3.5 top-3 text-gray-400 hover:text-gray-700 dark:hover:text-white">
              <i id="reg-eye" data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- Terms Agreement -->
        <div class="flex items-start gap-2 pt-0.5">
          <input type="checkbox" id="reg-terms" required class="w-4 h-4 mt-0.5 rounded text-[#D6FF36] focus:ring-0 accent-[#D6FF36] bg-gray-100 border-gray-300">
          <label for="reg-terms" class="text-[11px] text-gray-600 dark:text-gray-400 leading-tight select-none">
            I agree to the <a href="legal/terms.html" class="text-[#84cc16] dark:text-[#D6FF36] hover:underline font-bold">Terms of Service</a> & <a href="legal/privacy-policy.html" class="text-[#84cc16] dark:text-[#D6FF36] hover:underline font-bold">Privacy Policy</a>.
          </label>
        </div>

        <!-- Register CTA -->
        <button type="submit" class="btn-primary w-full !h-11 text-sm font-bold shadow-lg shadow-[#D6FF36]/20 mt-2 flex items-center justify-center gap-2 group">
          <i data-lucide="user-plus" class="w-4 h-4"></i>
          <span>Create Account</span>
        </button>

        <!-- Google Sign In Button -->
        <button type="button" onclick="handleSocialSignup('Google')" class="w-full h-11 rounded-xl border border-gray-300 dark:border-[#252E35] bg-white/70 dark:bg-transparent text-gray-800 dark:text-white hover:bg-gray-100 dark:hover:bg-[#1B252F] font-semibold text-xs flex items-center justify-center gap-2.5 transition-colors">
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Sign up with Google</span>
        </button>

      </form>

      <!-- Already Have Account Redirect -->
      <div class="text-center pt-5 mt-5 border-t border-gray-200/80 dark:border-[#252E35] text-xs text-gray-500 dark:text-gray-400">
        Already have an account? 
        <a href="login.html" class="font-bold text-[#101820] dark:text-[#D6FF36] hover:underline ml-1">
          Sign In
        </a>
      </div>

      <!-- Quick Back to Home -->
      <div class="text-center mt-3">
        <a href="index.html" class="text-[11px] text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-white flex items-center justify-center gap-1 transition-colors">
          <i data-lucide="arrow-left" class="w-3 h-3 rtl:rotate-180"></i> Back to Homepage
        </a>
      </div>

    </div>
  </div>

  <script src="assets/js/storage.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    function togglePasswordVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        input.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      if (window.lucide) window.lucide.createIcons();
    }

    function handleSignUp(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();

      // Save user to storage
      if (window.CS_STORAGE) {
        const newUser = {
          id: 'usr_' + Date.now(),
          name: name,
          email: email,
          phone: phone,
          avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80',
          role: 'customer'
        };
        window.CS_STORAGE.set(STORAGE_KEYS.USER, newUser);
      }

      showToast(`Welcome to CAR SHINE, ${name}! Setting up your dashboard...`, 'success');
      setTimeout(() => {
        window.location.href = 'customer/dashboard.html';
      }, 1000);
    }

    function handleSocialSignup(provider) {
      showToast(`Connecting with ${provider}...`, 'info');
      setTimeout(() => window.location.href = 'customer/dashboard.html', 1000);
    }
  </script>
</body>
</html>
