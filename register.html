<!DOCTYPE html>
<html lang="en" class="" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | CAR SHINE – Doorstep Car Detailing</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23D6FF36'><polygon points='12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2'/></svg>">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#101820',
            secondary: '#D6FF36',
            surface: '#252E35',
            lightbg: '#F5F6F3'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Manrope', 'sans-serif']
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/animations.css">
</head>
<body class="bg-[#F5F6F3] text-[#101820] dark:bg-[#101820] dark:text-[#F5F6F3] min-h-screen flex items-center justify-center p-4 relative transition-colors duration-300">

  <!-- Controls at Top Right (Theme & RTL 40x40px) -->
  <div class="fixed top-6 right-6 rtl:right-auto rtl:left-6 flex items-center gap-3 z-50">
    <button onclick="toggleTheme()" aria-label="Toggle Theme" class="w-10 h-10 rounded-xl border border-gray-200 dark:border-[#252E35] bg-white dark:bg-[#1A232C] text-gray-700 dark:text-gray-300 hover:text-[#D6FF36] flex items-center justify-center transition-colors shadow-sm">
      <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
      <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
    </button>
    <button onclick="toggleRTL()" aria-label="Toggle RTL Direction" class="w-10 h-10 rounded-xl border border-gray-200 dark:border-[#252E35] bg-white dark:bg-[#1A232C] text-gray-700 dark:text-gray-300 hover:text-[#D6FF36] flex items-center justify-center transition-colors shadow-sm font-bold text-xs">
      <i data-lucide="languages" class="w-4 h-4"></i>
    </button>
  </div>

  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[300px] bg-[#D6FF36]/10 blur-[120px] pointer-events-none rounded-full"></div>

  <!-- Sign Up Card (No navbar, no footer) -->
  <div class="w-full max-w-lg bg-white dark:bg-[#1A232C] border border-gray-200 dark:border-[#252E35] rounded-3xl p-8 sm:p-10 shadow-2xl relative z-10 my-8">
    
    <!-- Logo Inside Card -->
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center gap-2 mb-3 group">
        <div class="w-12 h-12 flex items-center justify-center group-hover:scale-105 transition-transform">
          <img src="assets/images/logo-icon.png" alt="CAR SHINE Logo Icon" class="w-full h-full object-contain drop-shadow-md">
        </div>
        <span class="text-2xl font-black tracking-wider uppercase font-heading text-gray-900 dark:text-white flex items-center gap-1.5">
          CAR <span class="text-[#D6FF36] font-black text-2xl drop-shadow-[0_1px_4px_rgba(0,0,0,0.4)]">SHINE</span>
        </span>
      </a>
      <h1 class="text-2xl font-black font-heading">Create an Account</h1>
      <p class="text-xs text-gray-500 mt-1">Book certified doorstep car detailing in minutes</p>
    </div>

    <!-- Sign Up Form (No demo credentials prefilled!) -->
    <form id="signup-form" onsubmit="handleSignUp(event)" class="space-y-4">
      
      <div>
        <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wider mb-1.5">Full Name *</label>
        <div class="relative">
          <input type="text" id="reg-name" required placeholder="e.g. Pravin Kumar" 
                 class="w-full h-12 pl-10 pr-4 rounded-xl bg-[#F5F6F3] dark:bg-[#101820] border border-gray-300 dark:border-[#252E35] text-sm focus:outline-none focus:border-[#D6FF36] transition-colors">
          <i data-lucide="user" class="w-4 h-4 text-gray-400 absolute left-3.5 top-4"></i>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wider mb-1.5">Email Address *</label>
          <div class="relative">
            <input type="email" id="reg-email" required placeholder="name@domain.com" 
                   class="w-full h-12 pl-10 pr-4 rounded-xl bg-[#F5F6F3] dark:bg-[#101820] border border-gray-300 dark:border-[#252E35] text-sm focus:outline-none focus:border-[#D6FF36] transition-colors">
            <i data-lucide="mail" class="w-4 h-4 text-gray-400 absolute left-3.5 top-4"></i>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wider mb-1.5">Mobile Number *</label>
          <div class="relative">
            <input type="tel" id="reg-phone" required placeholder="+91 98400 00000" 
                   class="w-full h-12 pl-10 pr-4 rounded-xl bg-[#F5F6F3] dark:bg-[#101820] border border-gray-300 dark:border-[#252E35] text-sm focus:outline-none focus:border-[#D6FF36] transition-colors">
            <i data-lucide="phone" class="w-4 h-4 text-gray-400 absolute left-3.5 top-4"></i>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wider mb-1.5">Password *</label>
          <div class="relative">
            <input type="password" id="reg-password" required placeholder="At least 8 chars" 
                   class="w-full h-12 pl-10 pr-10 rounded-xl bg-[#F5F6F3] dark:bg-[#101820] border border-gray-300 dark:border-[#252E35] text-sm focus:outline-none focus:border-[#D6FF36] transition-colors">
            <i data-lucide="lock" class="w-4 h-4 text-gray-400 absolute left-3.5 top-4"></i>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wider mb-1.5">Confirm Password *</label>
          <div class="relative">
            <input type="password" id="reg-confirm-password" required placeholder="Repeat password" 
                   class="w-full h-12 pl-10 pr-10 rounded-xl bg-[#F5F6F3] dark:bg-[#101820] border border-gray-300 dark:border-[#252E35] text-sm focus:outline-none focus:border-[#D6FF36] transition-colors">
            <i data-lucide="shield-check" class="w-4 h-4 text-gray-400 absolute left-3.5 top-4"></i>
          </div>
        </div>
      </div>

      <!-- Terms & Conditions checkbox -->
      <div class="pt-1">
        <label class="flex items-start gap-2.5 text-xs text-gray-600 dark:text-gray-400 cursor-pointer select-none">
          <input type="checkbox" id="terms-agree" required class="w-4 h-4 rounded text-[#D6FF36] focus:ring-0 accent-[#D6FF36] mt-0.5">
          <span>I agree to CAR SHINE's <a href="legal/terms.html" class="underline text-[#D6FF36]">Terms & Conditions</a> and <a href="legal/privacy-policy.html" class="underline text-[#D6FF36]">Privacy Policy</a>.</span>
        </label>
      </div>

      <!-- Create Account CTA matching inputs -->
      <button type="submit" class="btn-primary w-full !h-12 text-sm font-bold shadow-lg mt-2">
        <i data-lucide="user-plus" class="w-4 h-4"></i>
        <span>Create Account</span>
      </button>

      <!-- Google Sign Up -->
      <button type="button" onclick="handleSocialSignUp('Google')" class="w-full h-12 rounded-xl border border-gray-300 dark:border-[#252E35] bg-transparent text-gray-800 dark:text-white hover:bg-gray-100 dark:hover:bg-[#252E35] font-semibold text-xs flex items-center justify-center gap-2.5 transition-colors">
        <svg class="w-4 h-4" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Sign up with Google</span>
      </button>

    </form>

    <div class="text-center pt-6 mt-6 border-t border-gray-100 dark:border-[#252E35] text-xs text-gray-500">
      Already have an account? 
      <a href="login.html" class="font-bold text-[#101820] dark:text-[#D6FF36] hover:underline ml-1">
        Sign In
      </a>
    </div>

    <div class="text-center mt-3">
      <a href="index.html" class="text-[11px] text-gray-400 hover:text-white flex items-center justify-center gap-1">
        <i data-lucide="arrow-left" class="w-3 h-3 rtl:rotate-180"></i> Back to Homepage
      </a>
    </div>

  </div>

  <script src="assets/js/storage.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    function handleSignUp(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const pass = document.getElementById('reg-password').value;
      const confirmPass = document.getElementById('reg-confirm-password').value;

      if (pass !== confirmPass) {
        showToast('Passwords do not match! Please verify.', 'error');
        return;
      }

      const newUser = {
        id: 'usr_' + Date.now(),
        name,
        email,
        phone,
        avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80',
        role: 'customer'
      };

      StorageService.saveUser(newUser);
      showToast(`Account created successfully for ${name}! Redirecting...`, 'success');
      setTimeout(() => window.location.href = 'customer/dashboard.html', 900);
    }

    function handleSocialSignUp(provider) {
      showToast(`Creating account via ${provider}...`, 'info');
      setTimeout(() => window.location.href = 'customer/dashboard.html', 1000);
    }
  </script>
</body>
</html>
