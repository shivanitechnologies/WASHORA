<!DOCTYPE html>
<html lang="en" class="" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Management | CAR SHINE Admin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23D6FF36'><polygon points='12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2'/></svg>">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#101820',
            secondary: '#D6FF36',
            surface: '#252E35',
            lightbg: '#F5F6F3'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Manrope', 'sans-serif']
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
</head>
<body class="bg-[#F5F6F3] text-[#101820] dark:bg-[#101820] dark:text-[#F5F6F3] transition-colors duration-300">

  <div class="dashboard-container">
    <aside id="dash-sidebar" class="dashboard-sidebar bg-white dark:bg-[#1A232C] border-r border-gray-200 dark:border-[#252E35] flex flex-col justify-between p-5 overflow-y-auto max-h-screen">
      <div>
        <div class="flex items-center justify-between pb-6 border-b border-gray-200 dark:border-[#252E35]">
          <a href="../index.html" class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-xl bg-[#101820] dark:bg-[#252E35] text-[#D6FF36] flex items-center justify-center font-black">
              <i data-lucide="shield-check" class="w-4 h-4"></i>
            </div>
            <span class="text-lg font-black tracking-wider uppercase font-heading text-gray-900 dark:text-white">
              CAR <span class="text-[#D6FF36] bg-[#101820] px-1.5 py-0.5 rounded text-xs font-black">ADMIN</span>
            </span>
          </a>
          <button id="sidebar-close-btn" class="lg:hidden p-1.5 rounded-lg bg-gray-100 dark:bg-[#252E35]"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>

        <nav class="space-y-1 text-xs font-semibold mt-6">
          <a href="dashboard.html" class="dash-nav-item"><i data-lucide="layout-dashboard" class="w-4 h-4"></i><span>Overview</span></a>
          <a href="customers.html" class="dash-nav-item"><i data-lucide="users" class="w-4 h-4"></i><span>Customers</span></a>
          <a href="bookings.html" class="dash-nav-item"><i data-lucide="calendar" class="w-4 h-4"></i><span>Bookings</span></a>
          <a href="technicians.html" class="dash-nav-item"><i data-lucide="wrench" class="w-4 h-4"></i><span>Technicians</span></a>
          <a href="assign-technician.html" class="dash-nav-item"><i data-lucide="user-plus" class="w-4 h-4 text-[#D6FF36]"></i><span>Assign Technician</span></a>
          <a href="services.html" class="dash-nav-item active"><i data-lucide="layers" class="w-4 h-4"></i><span>Services</span></a>
          <a href="pricing.html" class="dash-nav-item"><i data-lucide="tag" class="w-4 h-4"></i><span>Pricing & Plans</span></a>
          <a href="subscriptions.html" class="dash-nav-item"><i data-lucide="repeat" class="w-4 h-4"></i><span>Subscriptions</span></a>
          <a href="service-areas.html" class="dash-nav-item"><i data-lucide="map-pin" class="w-4 h-4"></i><span>Service Areas</span></a>
          <a href="payments.html" class="dash-nav-item"><i data-lucide="credit-card" class="w-4 h-4"></i><span>Payments</span></a>
          <a href="reviews.html" class="dash-nav-item"><i data-lucide="star" class="w-4 h-4"></i><span>Reviews</span></a>
          <a href="messages.html" class="dash-nav-item"><i data-lucide="message-square" class="w-4 h-4"></i><span>Messages</span></a>
          <a href="analytics.html" class="dash-nav-item"><i data-lucide="bar-chart-3" class="w-4 h-4"></i><span>Analytics & Reports</span></a>
          <a href="settings.html" class="dash-nav-item"><i data-lucide="settings" class="w-4 h-4"></i><span>Settings</span></a>
        </nav>
      </div>

      <div class="pt-4 border-t border-gray-200 dark:border-[#252E35]">
        <a href="../login.html" class="flex items-center gap-3 px-3 py-2 text-xs font-bold text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 rounded-xl transition-colors">
          <i data-lucide="log-out" class="w-4 h-4"></i>
          <span>Admin Logout</span>
        </a>
      </div>
    </aside>

    <div class="dashboard-main bg-[#F5F6F3] dark:bg-[#101820]">
      <header class="h-20 px-6 sm:px-8 border-b border-gray-200 dark:border-[#252E35] bg-white dark:bg-[#1A232C] flex items-center justify-between sticky top-0 z-30">
        <div class="flex items-center gap-3">
          <button id="sidebar-open-btn" class="lg:hidden p-2 rounded-xl bg-gray-100 dark:bg-[#252E35]"><i data-lucide="menu" class="w-5 h-5"></i></button>
          <div>
            <h1 class="text-lg font-bold font-heading">Services Catalog</h1>
            <p class="text-xs text-gray-500">Configure detailing packages, durations, and pricing</p>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <button onclick="openModal('add-service-modal')" class="btn-primary !h-10 text-xs font-bold px-4">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i> Add Service
          </button>
          <button onclick="toggleTheme()" aria-label="Toggle Theme" class="w-10 h-10 rounded-xl border border-gray-200 dark:border-[#252E35] bg-gray-100 dark:bg-[#101820] text-gray-700 dark:text-gray-300 hover:text-[#D6FF36] flex items-center justify-center transition-colors">
            <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
            <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
          </button>
        </div>
      </header>

      <main class="p-6 sm:p-8 space-y-6 flex-1">
        <div id="admin-services-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <!-- Rendered via JS -->
        </div>
      </main>
    </div>
  </div>

  <!-- Add Service Modal -->
  <div id="add-service-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-white dark:bg-[#1A232C] border border-gray-200 dark:border-[#252E35] w-full max-w-md rounded-3xl p-6 sm:p-8 shadow-2xl relative">
      <div class="flex items-center justify-between pb-4 border-b border-gray-200 dark:border-[#252E35]">
        <h3 class="font-bold text-base font-heading">Add New Service</h3>
        <button onclick="closeModal('add-service-modal')" class="p-1 rounded-lg bg-gray-100 dark:bg-[#252E35]">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <form onsubmit="handleCreateService(event)" class="py-5 space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Service Name *</label>
          <input type="text" id="srv-name" required placeholder="e.g. Headlight Restoration" class="w-full h-11 px-3 rounded-xl bg-[#F5F6F3] dark:bg-[#101820] border border-gray-300 dark:border-[#252E35] text-xs">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Estimated Duration *</label>
          <input type="text" id="srv-duration" required placeholder="e.g. 45 - 60 Mins" class="w-full h-11 px-3 rounded-xl bg-[#F5F6F3] dark:bg-[#101820] border border-gray-300 dark:border-[#252E35] text-xs">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Base Price (₹) *</label>
          <input type="number" id="srv-price" required placeholder="e.g. 899" class="w-full h-11 px-3 rounded-xl bg-[#F5F6F3] dark:bg-[#101820] border border-gray-300 dark:border-[#252E35] text-xs">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Short Description *</label>
          <textarea id="srv-desc" required rows="3" placeholder="Brief explanation of the service process..." class="w-full p-3 rounded-xl bg-[#F5F6F3] dark:bg-[#101820] border border-gray-300 dark:border-[#252E35] text-xs"></textarea>
        </div>

        <div class="pt-3 border-t border-gray-100 dark:border-[#252E35] flex justify-end gap-3">
          <button type="button" onclick="closeModal('add-service-modal')" class="btn-secondary !h-10 text-xs">Cancel</button>
          <button type="submit" class="btn-primary !h-10 text-xs font-bold px-6">Save Service</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/rtl.js"></script>
  <script src="../assets/js/main.js"></script>
  <script>
    document.getElementById('sidebar-open-btn').addEventListener('click', () => {
      document.getElementById('dash-sidebar').classList.add('open');
    });
    document.getElementById('sidebar-close-btn').addEventListener('click', () => {
      document.getElementById('dash-sidebar').classList.remove('open');
    });

    function renderAdminServices() {
      const services = StorageService.getServices();
      const container = document.getElementById('admin-services-grid');

      container.innerHTML = services.map(s => `
        <div class="rounded-3xl bg-white dark:bg-[#1A232C] border border-gray-200 dark:border-[#252E35] shadow-sm overflow-hidden flex flex-col justify-between card-hover-glow">
          <div>
            <div class="relative h-44 overflow-hidden">
              <img src="${s.image}" alt="${s.name}" class="w-full h-full object-cover">
              <span class="absolute top-3 left-3 badge-lime">${s.duration}</span>
            </div>
            <div class="p-5">
              <h3 class="text-lg font-bold font-heading text-gray-900 dark:text-white">${s.name}</h3>
              <p class="text-xs text-gray-500 dark:text-gray-400 mt-1 line-clamp-2">${s.description}</p>
              
              <div class="flex items-baseline justify-between mt-4 pt-3 border-t border-gray-100 dark:border-[#252E35]">
                <span class="text-xs text-gray-400 font-bold uppercase">Price:</span>
                <span class="text-xl font-black text-[#101820] dark:text-[#D6FF36]">₹${s.price.toLocaleString('en-IN')}</span>
              </div>
            </div>
          </div>

          <div class="p-5 pt-0 flex items-center justify-between gap-2">
            <span class="badge-lime text-[10px]">Active</span>
            <button onclick="editServicePrice('${s.id}')" class="text-xs font-bold text-[#D6FF36] hover:underline">Edit Price</button>
          </div>
        </div>
      `).join('');

      if (window.lucide) window.lucide.createIcons();
    }

    function editServicePrice(id) {
      const s = StorageService.getServiceById(id);
      if (!s) return;
      const newPrice = prompt(`Enter new price for ${s.name}:`, s.price);
      if (newPrice && !isNaN(newPrice)) {
        s.price = parseInt(newPrice, 10);
        const list = StorageService.getServices();
        const idx = list.findIndex(item => item.id === s.id);
        if (idx !== -1) {
          list[idx] = s;
          localStorage.setItem('cs_services', JSON.stringify(list));
        }
        showToast(`Updated price of ${s.name} to ₹${newPrice}!`, 'success');
        renderAdminServices();
      }
    }

    function handleCreateService(e) {
      e.preventDefault();
      const name = document.getElementById('srv-name').value;
      const duration = document.getElementById('srv-duration').value;
      const price = parseInt(document.getElementById('srv-price').value, 10);
      const desc = document.getElementById('srv-desc').value;

      const list = StorageService.getServices();
      list.push({
        id: 'srv_' + Date.now(),
        name,
        duration,
        price,
        description: desc,
        tagline: 'Custom Doorstep Detailing',
        included: ['Professional treatment', 'Certified detailer'],
        image: 'https://images.unsplash.com/photo-1601362840469-51e4d8d58785?auto=format&fit=crop&w=800&q=80'
      });
      localStorage.setItem('cs_services', JSON.stringify(list));

      closeModal('add-service-modal');
      showToast(`${name} added to catalog!`, 'success');
      renderAdminServices();
    }

    document.addEventListener('DOMContentLoaded', renderAdminServices);
  </script>
</body>
</html>
