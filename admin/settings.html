<!DOCTYPE html>
<html lang="en" class="" dir="ltr">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Operations Settings | CAR SHINE Command Center</title>
 <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23D6FF36'><polygon points='12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2'/></svg>">
 
 <script src="https://cdn.tailwindcss.com"></script>
 <script>
  tailwind.config = {
   darkMode: 'class',
   theme: {
    extend: {
     colors: {
      primary: '#101820',
      secondary: '#D6FF36',
      surface: '#252E35',
      lightbg: '#F5F6F3'
     },
     fontFamily: {
      sans: ['Inter', 'sans-serif'],
      brand: ['Montserrat', 'Outfit', 'sans-serif'],
      heading: ['Manrope', 'sans-serif']
     }
    }
   }
  }
 </script>
 <script src="https://unpkg.com/lucide@latest"></script>

 <link rel="stylesheet" href="../assets/css/style.css">
 <link rel="stylesheet" href="../assets/css/dashboard.css">
 <link rel="stylesheet" href="../assets/css/animations.css">
 <link rel="stylesheet" href="../assets/css/mobile-responsive.css">
</head>
<body class="bg-[#F5F6F3] text-[#101820] dark:bg-[#101820] dark:text-[#F5F6F3] transition-colors duration-300">

 <div class="dashboard-container">
  
  <!-- ADMIN SIDEBAR -->
  <aside id="dash-sidebar" class="dashboard-sidebar bg-white dark:bg-[#1A232C] border-r border-gray-200 dark:border-[#252E35] flex flex-col justify-between p-5 ">
   <div>
    <!-- Logo -->
    <div class="flex items-center justify-between pb-6 border-b border-gray-200 dark:border-[#252E35]">
     <a href="../index.html" class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-[#101820] dark:bg-[#252E35] text-[#D6FF36] flex items-center justify-center font-black">
       <i data-lucide="shield-check" class="w-4 h-4"></i>
      </div>
      <span class="text-lg font-black tracking-wider uppercase font-heading text-gray-900 dark:text-white">
       CAR <span class="text-[#D6FF36] bg-[#101820] px-1.5 py-0.5 rounded text-xs font-black">ADMIN</span>
      </span>
     </a>
      <button type="submit" class="btn-primary !h-12 text-xs font-bold px-8">
       <i data-lucide="save" class="w-4 h-4"></i>
       <span>Save System Settings</span>
      </button>
     </div>

    </form>

   </main>
  </div>
 </div>

 <script src="../assets/js/storage.js"></script>
 <script src="../assets/js/theme.js"></script>
 <script src="../assets/js/rtl.js"></script>
 <script src="../assets/js/main.js"></script>

 <script>
  function loadSettings() {
   const s = StorageService.getSettings();
   document.getElementById('set-brand').value = s.brandName || 'CAR SHINE';
   document.getElementById('set-tagline').value = s.tagline || 'Your Car, Always Shining.';
   document.getElementById('set-email').value = s.supportEmail || 'support@carshine.com';
   document.getElementById('set-phone').value = s.dispatchPhone || '+91 98401 99999';
   document.getElementById('set-headquarters').value = s.headquarters || 'Anna Nagar West, Chennai';
   document.getElementById('set-hours').value = s.operatingHours || '07:00 AM - 08:00 PM';
   document.getElementById('set-radius').value = s.maxRadiusKm || 35;
   document.getElementById('set-rain').value = s.rainGuaranteeHours || 24;
   document.getElementById('set-tax').value = s.taxRatePercent || 18;
   document.getElementById('set-currency').value = s.currency || 'INR (₹)';
   document.getElementById('set-auto-assign').checked = !!s.autoAssignTechnicians;
   document.getElementById('set-sms').checked = !!s.smsNotifications;
   document.getElementById('set-invoices').checked = !!s.emailInvoices;
  }

  function handleSaveSettings(e) {
   e.preventDefault();
   const updated = {
    brandName: document.getElementById('set-brand').value.trim(),
    tagline: document.getElementById('set-tagline').value.trim(),
    supportEmail: document.getElementById('set-email').value.trim(),
    dispatchPhone: document.getElementById('set-phone').value.trim(),
    headquarters: document.getElementById('set-headquarters').value.trim(),
    operatingHours: document.getElementById('set-hours').value.trim(),
    maxRadiusKm: Number(document.getElementById('set-radius').value),
    rainGuaranteeHours: Number(document.getElementById('set-rain').value),
    taxRatePercent: Number(document.getElementById('set-tax').value),
    currency: document.getElementById('set-currency').value.trim(),
    autoAssignTechnicians: document.getElementById('set-auto-assign').checked,
    smsNotifications: document.getElementById('set-sms').checked,
    emailInvoices: document.getElementById('set-invoices').checked
   };

   StorageService.saveSettings(updated);
   showToast('Operations & system settings successfully updated!', 'success');
  }

  function handleResetDefaults() {
   if (confirm('Reset all operational settings to default factory values?')) {
    StorageService.saveSettings(DEFAULT_SETTINGS);
    loadSettings();
    showToast('Settings reset to system defaults', 'info');
   }
  }

  document.addEventListener('DOMContentLoaded', () => {
   loadSettings();

   const openBtn = document.getElementById('sidebar-open-btn');
   const closeBtn = document.getElementById('sidebar-close-btn');
   const sidebar = document.getElementById('dash-sidebar');

   if (openBtn && sidebar) {
    openBtn.addEventListener('click', () => sidebar.classList.add('open'));
   }
   if (closeBtn && sidebar) {
    closeBtn.addEventListener('click', () => sidebar.classList.remove('open'));
   }
  });
 </script>
</body>
</html>
