<body class="bg-[#F5F6F3] text-[#101820] dark:bg-[#101820] dark:text-[#F5F6F3] transition-colors duration-300">

 <div class="dashboard-container">
  <aside id="dash-sidebar" class="dashboard-sidebar bg-white dark:bg-[#1A232C] border-r border-gray-200 dark:border-[#252E35] flex flex-col justify-between p-5 ">
   <div>
    <div class="flex items-center justify-between pb-6 border-b border-gray-200 dark:border-[#252E35]">
     <a href="../index.html" class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-[#101820] dark:bg-[#252E35] text-[#D6FF36] flex items-center justify-center font-black">
       <i data-lucide="shield-check" class="w-4 h-4"></i>
      </div>
      <span class="text-lg font-black tracking-wider uppercase font-heading text-gray-900 dark:text-white">
       CAR <span class="text-[#D6FF36] bg-[#101820] px-1.5 py-0.5 rounded text-xs font-black">ADMIN</span>
      </span>
     </a>
     <button id="sidebar-close-btn" class="lg:hidden p-1.5 rounded-lg bg-gray-100 dark:bg-[#252E35]"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>

    <nav class="space-y-1 text-xs font-semibold mt-6">
     <a href="dashboard.html" class="dash-nav-item"><i data-lucide="layout-dashboard" class="w-4 h-4"></i><span>Overview</span></a>
     <a href="customers.html" class="dash-nav-item"><i data-lucide="users" class="w-4 h-4"></i><span>Customers</span></a>
     <a href="bookings.html" class="dash-nav-item"><i data-lucide="calendar" class="w-4 h-4"></i><span>Bookings</span></a>
     <a href="technicians.html" class="dash-nav-item active"><i data-lucide="wrench" class="w-4 h-4"></i><span>Technicians</span></a>
     <a href="assign-technician.html" class="dash-nav-item"><i data-lucide="user-plus" class="w-4 h-4 text-[#D6FF36]"></i><span>Assign Technician</span></a>
     <a href="services.html" class="dash-nav-item"><i data-lucide="layers" class="w-4 h-4"></i><span>Services</span></a>
     <a href="pricing.html" class="dash-nav-item"><i data-lucide="tag" class="w-4 h-4"></i><span>Pricing & Plans</span></a>
     <a href="subscriptions.html" class="dash-nav-item"><i data-lucide="repeat" class="w-4 h-4"></i><span>Subscriptions</span></a>
     <a href="service-areas.html" class="dash-nav-item"><i data-lucide="map-pin" class="w-4 h-4"></i><span>Service Areas</span></a>
     <a href="payments.html" class="dash-nav-item"><i data-lucide="credit-card" class="w-4 h-4"></i><span>Payments</span></a>
     <a href="reviews.html" class="dash-nav-item"><i data-lucide="star" class="w-4 h-4"></i><span>Reviews</span></a>
     <a href="messages.html" class="dash-nav-item"><i data-lucide="message-square" class="w-4 h-4"></i><span>Messages</span></a>
     <a href="analytics.html" class="dash-nav-item"><i data-lucide="bar-chart-3" class="w-4 h-4"></i><span>Analytics & Reports</span></a>
     <a href="settings.html" class="dash-nav-item"><i data-lucide="settings" class="w-4 h-4"></i><span>Settings</span></a>
    </nav>
   </div>

   <div class="pt-4 border-t border-gray-200 dark:border-[#252E35]">
    <a href="../login.html" class="flex items-center gap-3 px-3 py-2 text-xs font-bold text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 rounded-xl transition-colors">
     <i data-lucide="log-out" class="w-4 h-4"></i>
     <span>Admin Logout</span>
    </a>
   </div>
  </aside>

  <div class="dashboard-main bg-[#F5F6F3] dark:bg-[#101820]">
   <header class="h-20 px-6 sm:px-8 border-b border-gray-200 dark:border-[#252E35] bg-white dark:bg-[#1A232C] flex items-center justify-between sticky top-0 z-30">
    <div class="flex items-center gap-3">
     <button id="sidebar-open-btn" class="lg:hidden p-2 rounded-xl bg-gray-100 dark:bg-[#252E35]"><i data-lucide="menu" class="w-5 h-5"></i></button>
    </div>

    <div class="flex items-center gap-3">
     <button onclick="openModal('add-tech-modal')" class="btn-primary !h-10 text-xs font-bold px-4">
      <i data-lucide="plus" class="w-3.5 h-3.5"></i>
      <span>Add Technician</span>
     </button>
     <button onclick="toggleTheme()" aria-label="Toggle Theme" class="w-10 h-10 rounded-xl border border-gray-200 dark:border-[#252E35] bg-gray-100 dark:bg-[#101820] text-gray-700 dark:text-gray-300 hover:text-[#D6FF36] flex items-center justify-center transition-colors">
      <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
      <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
     </button>
    </div>
   </header>

   <main class="p-6 sm:p-8 space-y-6 flex-1">
        
        <!-- PAGE HEADING SECTION -->
        <div class="space-y-1 mb-6">
          <h1 class="text-2xl sm:text-3xl font-black font-heading text-gray-900 dark:text-white">Mobile Van Technicians</h1>
          <p class="text-xs sm:text-sm text-gray-500">Fleet management, ratings and real-time availability</p>
        </div>
    <div id="technicians-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
     <!-- Populated via JS -->
    </div>
   </main>
  </div>
 </div>

 <!-- Add Technician Modal -->
 <div id="add-tech-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4">
  <div class="bg-white dark:bg-[#1A232C] border border-gray-200 dark:border-[#252E35] w-full max-w-md rounded-3xl p-6 sm:p-8 shadow-2xl relative">
   <div class="flex items-center justify-between pb-4 border-b border-gray-200 dark:border-[#252E35]">
    <h3 class="font-bold text-base font-heading">Add Fleet Technician</h3>
    <button onclick="closeModal('add-tech-modal')" class="p-1 rounded-lg bg-gray-100 dark:bg-[#252E35]">
     <i data-lucide="x" class="w-4 h-4"></i>
    </button>
   </div>

   <form onsubmit="handleCreateTechnician(event)" class="py-5 space-y-4">
    <div>
     <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Technician Name *</label>
     <input type="text" id="tech-name" required placeholder="e.g. Anand Murugan" class="w-full h-11 px-3 rounded-xl bg-[#F5F6F3] dark:bg-[#101820] border border-gray-300 dark:border-[#252E35] text-xs">
    </div>
    <div>
     <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Mobile Phone *</label>
     <input type="tel" id="tech-phone" required placeholder="+91 94440 00000" class="w-full h-11 px-3 rounded-xl bg-[#F5F6F3] dark:bg-[#101820] border border-gray-300 dark:border-[#252E35] text-xs">
    </div>
    <div>
     <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Van License Plate *</label>
     <input type="text" id="tech-van" required placeholder="TN 09 XX 1234" class="w-full h-11 px-3 rounded-xl bg-[#F5F6F3] dark:bg-[#101820] border border-gray-300 dark:border-[#252E35] text-xs font-mono uppercase">
    </div>
    <div>
     <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Assigned Operational Hub *</label>
     <select id="tech-hub" class="w-full h-11 px-3 rounded-xl bg-[#F5F6F3] dark:bg-[#101820] border border-gray-300 dark:border-[#252E35] text-xs">
      <option value="Anna Nagar West">Anna Nagar Hub</option>
      <option value="Velachery Bypass">Velachery Hub</option>
      <option value="Tambaram East">Tambaram Hub</option>
      <option value="OMR Perungudi">OMR IT Corridor</option>
      <option value="Guindy Estate">Guindy Hub</option>
     </select>
    </div>

    <div class="pt-3 border-t border-gray-100 dark:border-[#252E35] flex justify-end gap-3">
     <button type="button" onclick="closeModal('add-tech-modal')" class="btn-secondary !h-10 text-xs">Cancel</button>
     <button type="submit" class="btn-primary !h-10 text-xs font-bold px-6">Save Technician</button>
    </div>
   </form>
  </div>
 </div>

 <script src="../assets/js/storage.js"></script>
 <script src="../assets/js/theme.js"></script>
 <script src="../assets/js/rtl.js"></script>
 <script src="../assets/js/main.js"></script>
 <script>
  document.getElementById('sidebar-open-btn').addEventListener('click', () => {
   document.getElementById('dash-sidebar').classList.add('open');
  });
  document.getElementById('sidebar-close-btn').addEventListener('click', () => {
   document.getElementById('dash-sidebar').classList.remove('open');
  });

  function renderTechnicians() {
   const technicians = StorageService.getTechnicians();
   const container = document.getElementById('technicians-grid');

   container.innerHTML = technicians.map(t => `
    <div class="p-6 rounded-3xl bg-white dark:bg-[#1A232C] border border-gray-200 dark:border-[#252E35] shadow-sm flex flex-col justify-between text-center card-hover-glow">
     <div>
      <div class="relative w-20 h-20 mx-auto mb-3">
       <img src="${t.avatar}" alt="${t.name}" class="w-full h-full aspect-square rounded-2xl object-cover object-center border-2 border-[#D6FF36] shadow-sm">
       <span class="absolute -bottom-1 -right-1 w-3.5 h-3.5 rounded-full border-2 border-[#1A232C] ${t.status === 'On Job' ? 'bg-[#D6FF36]' : t.status === 'Available' ? 'bg-emerald-400' : 'bg-gray-400'}"></span>
      </div>
      <h4 class="font-bold text-sm text-gray-900 dark:text-white">${t.name}</h4>
      <span class="text-xs text-[#D6FF36] font-semibold">${t.status}</span>
      <div class="mt-2 text-xs text-amber-400 font-bold">${t.rating} ★ · <span class="text-gray-400 font-normal">${t.totalJobs} jobs</span></div>

      <div class="p-3 my-4 rounded-xl bg-[#F5F6F3] dark:bg-[#101820] text-left text-[11px] space-y-1">
       <div><strong>Van:</strong> <span class="font-mono text-[#D6FF36]">${t.vanNumber}</span></div>
       <div class="truncate"><strong>Zone:</strong> ${t.currentLocation}</div>
       <div><strong>Tel:</strong> ${t.phone}</div>
      </div>
     </div>

     <div class="pt-2 border-t border-gray-100 dark:border-[#252E35]">
      <a href="assign-technician.html?techId=${t.id}" class="btn-primary w-full !h-8 text-xs font-bold">Assign Job</a>
     </div>
    </div>
   `).join('');

   if (window.lucide) window.lucide.createIcons();
  }

  function handleCreateTechnician(e) {
   e.preventDefault();
   const name = document.getElementById('tech-name').value;
   const phone = document.getElementById('tech-phone').value;
   const van = document.getElementById('tech-van').value;
   const hub = document.getElementById('tech-hub').value;

   const techList = StorageService.getTechnicians();
   techList.push({
    id: 'tech_' + Date.now(),
    name,
    phone,
    vanNumber: van,
    vanType: 'Custom Detailing Mobile Van',
    rating: 5.0,
    totalJobs: 0,
    status: 'Available',
    currentLocation: hub,
    avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=200&q=80'
   });
   localStorage.setItem('cs_technicians', JSON.stringify(techList));

   closeModal('add-tech-modal');
   showToast(`Technician ${name} registered to fleet!`, 'success');
   renderTechnicians();
  }

  document.addEventListener('DOMContentLoaded', renderTechnicians);
 </script>
</body>
</html>
